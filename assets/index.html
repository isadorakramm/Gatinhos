<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    video {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh; object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas-mediapipe { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; }
    #canvas-three     { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
    #status { position: absolute; top: 10px; left: 10px; color: lime; font-family: monospace; font-size: 14px; z-index: 99; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas-mediapipe"></canvas>
  <canvas id="canvas-three"></canvas>
  <div id="status">Iniciando câmera...</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const video  = document.getElementById('video');
    const canvas = document.getElementById('canvas-mediapipe');
    const status = document.getElementById('status');

    const threeCanvas = document.getElementById('canvas-three');
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(63, window.innerWidth / window.innerHeight, 0.01, 100);
    cam.position.z = 1;

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(0, 1, 2);
    scene.add(dirLight);

    let glassesWrapper = null;

    const loader = new THREE.GLTFLoader();
    loader.load(
      'http://localhost:3000/reading_glasses.glb',
      (gltf) => {
        const model = gltf.scene;
        model.rotation.set(0, 0, 0);
        model.position.set(0, 0, 0);
        const wrapper = new THREE.Group();
        wrapper.add(model);
        scene.add(wrapper);
        glassesWrapper = wrapper;
        status.textContent = '✅ Modelo carregado! Aponte o rosto...';
      },
      (p) => { if (p.total > 0) status.textContent = 'Carregando: ' + Math.round(p.loaded/p.total*100) + '%'; },
      (e) => { status.textContent = 'Erro: ' + e.message; }
    );

    function lmToVec3(lm) {
      return new THREE.Vector3(
        -(lm.x * 2 - 1),
        -(lm.y * 2 - 1),
        -lm.z * 2        // igual ao código do github
      );
    }

    const faceMesh = new FaceMesh({
      locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + f
    });
    faceMesh.setOptions({
      maxNumFaces: 1, refineLandmarks: true,
      minDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
    });

    faceMesh.onResults(results => {
      if (!glassesWrapper) return;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const lms = results.multiFaceLandmarks[0];

        const noseBridge = lmToVec3(lms[6]);
        const templeL    = lmToVec3(lms[234]);
        const templeR    = lmToVec3(lms[454]);
        const chin       = lmToVec3(lms[152]);
        const top        = lmToVec3(lms[10]);

        // Posição
        const center = new THREE.Vector3()
          .addVectors(templeL, templeR)
          .multiplyScalar(0.5);
        center.y = noseBridge.y;
        center.z = noseBridge.z;
        glassesWrapper.position.copy(center);

        // Escala
        const faceWidth = templeL.distanceTo(templeR);
        glassesWrapper.scale.setScalar(faceWidth * 0.22);

        // Rotação calculada diretamente com ângulos — sem makeBasis
        // angleZ: inclinação lateral (eixo entre as têmporas)
        const dir = new THREE.Vector3().subVectors(templeR, templeL).normalize();
        const angleZ = Math.atan2(dir.y, dir.x);

        // angleY: virar a cabeça pra esquerda/direita (diferença de Z entre têmporas)
        const angleY = Math.atan2(templeR.z - templeL.z, faceWidth);

        // angleX: inclinar pra cima/baixo (diferença de Z entre topo e queixo)
        const faceHeight = top.distanceTo(chin);
        const angleX = Math.atan2(top.z - chin.z, faceHeight);

        glassesWrapper.rotation.set(angleX + Math.PI, -angleY + Math.PI, angleZ);

        status.textContent = '✅ Rosto detectado!';
      } else {
        status.textContent = '👀 Procurando rosto...';
      }

      renderer.render(scene, cam);
    });

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          status.textContent = '📷 Câmera OK, carregando IA...';
          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
          const c = new Camera(video, {
            onFrame: async () => { await faceMesh.send({ image: video }); },
            width: 640, height: 480,
          });
          c.start();
        };
      })
      .catch(e => { status.textContent = 'Erro câmera: ' + e.message; });

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      cam.aspect = window.innerWidth / window.innerHeight;
      cam.updateProjectionMatrix();
    });
  </script>
</body>
</html>
