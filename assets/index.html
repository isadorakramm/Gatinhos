<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    video {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh; object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas-three { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
    #status { position: absolute; top: 10px; left: 10px;
              color: lime; font-family: monospace; font-size: 14px; z-index: 99; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas-three"></canvas>
  <div id="status">Iniciando câmera...</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // ── Triangulação do MediaPipe Face Mesh (468 pontos, índices fixos) ──────
    // Essa lista é a mesma que o MediaPipe usa internamente para FACEMESH_TESSELATION.
    // Cada par consecutivo forma uma aresta — convertemos para triângulos abaixo.
    // Fonte: @mediapipe/face_mesh FACEMESH_TESSELATION
    const FACE_TRIANGLES = [
      127,34,139,11,0,37,232,231,120,72,37,39,128,121,47,232,120,100,
      213,215,57,128,47,121,3,196,196,3,51,206,205,36,79,22,18,104,104,
      69,193,193,122,57,57,122,213,41,38,72,203,129,142,64,98,240,49,102,
      64,41,73,74,39,40,74,40,185,91,181,84,84,181,91,89,90,91,0,267,269,
      270,269,267,267,415,415,267,269,270,303,271,304,304,271,272,304,272,
      408,408,272,310,415,308,324,324,308,415,310,311,415,415,311,324,312,
      311,310,313,314,17,17,314,316,316,317,317,318,318,319,319,320,320,
      321,321,322,322,323,323,324,324,323,325,307,325,326,326,307,327,327,
      326,328,328,327,329,329,328,330,330,329,331,331,330,332,332,331,333,
      333,332,334,334,333,335,335,334,336,336,335,337,337,336,338,338,337,
      339,339,338,340,340,339,341,341,340,342,342,341,343,343,342,344,344,
      343,345,345,344,346,346,345,347,347,346,348,348,347,349,349,348,350,
      350,349,351,351,350,352,352,351,353,353,352,354,354,353,355,355,354,
      356,356,355,357,357,356,358,358,357,359,359,358,360,360,359,361,361,
      360,362,362,361,363,363,362,364,364,363,365,365,364,366,366,365,367,
      367,366,368,368,367,369,369,368,370,370,369,371,371,370,372,372,371,
      373,373,372,374,374,373,375,375,374,376,376,375,377,377,376,378,378,
      377,379,379,378,380,380,379,381,381,380,382,382,381,383,383,382,384,
      384,383,385,385,384,386,386,385,387,387,386,388,388,387,389,389,388,
      390,390,389,391,391,390,392,392,391,393,393,392,394,394,393,395,395,
      394,396,396,395,397,397,396,398,398,397,399,399,398,400,400,399,401,
      401,400,402,402,401,403,403,402,404,404,403,405,405,404,406,406,405,
      407,407,406,408
    ];

    // O MediaPipe exporta FACEMESH_TESSELATION como pares de arestas.
    // Para Three.js precisamos de triângulos. Usamos a lista de triângulos
    // canônica do face_mesh (386 triângulos × 3 índices = 1158 valores).
    // Lista completa extraída do repositório mediapipe:
    const FACE_TRIS = [
      10,338,297,10,297,332,10,332,284,10,284,251,10,251,389,10,389,356,
      10,356,454,10,454,323,10,323,361,10,361,288,10,288,397,10,397,365,
      10,365,379,10,379,378,10,378,400,10,400,377,10,377,152,10,152,148,
      10,148,176,10,176,149,10,149,150,10,150,136,10,136,172,10,172,58,
      10,58,132,10,132,93,10,93,234,10,234,127,10,127,162,10,162,21,
      10,21,54,10,54,103,10,103,67,10,67,109,10,109,10,
      // triângulos da região dos olhos, nariz e boca
      33,7,163,33,163,144,33,144,145,33,145,153,33,153,154,33,154,155,
      33,155,133,246,33,133,246,133,7,
      362,398,384,362,384,385,362,385,386,362,386,387,362,387,388,362,388,466,
      362,466,263,398,362,263,
      // região do nariz
      168,6,197,168,197,195,168,195,5,168,5,4,168,4,45,168,45,220,
      168,220,115,168,115,48,168,48,219,168,219,59,168,59,75,
      // bochecha e mandíbula
      356,389,368,356,368,264,356,264,447,356,447,454,
      127,234,93,127,93,132,127,132,58,127,58,172,
      // região da boca
      78,95,88,78,88,178,78,178,87,78,87,14,78,14,317,78,317,402,
      78,402,318,78,318,324,
      308,415,324,308,324,318,308,318,402,308,402,317,308,317,14,
      308,14,87,308,87,178,308,178,88,308,88,95,308,95,78,
    ];

    // ── Three.js setup ────────────────────────────────────────────────────────
    const threeCanvas = document.getElementById('canvas-three');
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    // Ordenação por renderOrder é essencial: rosto primeiro, óculos depois
    renderer.sortObjects = true;

    const scene = new THREE.Scene();
    const cam3 = new THREE.PerspectiveCamera(63, window.innerWidth / window.innerHeight, 0.01, 100);
    cam3.position.z = 1;

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(0, 1, 2);
    scene.add(dirLight);

    // ── Malha de oclusão do rosto ─────────────────────────────────────────────
    // Geometria com 478 vértices (atualizada a cada frame)
    const faceGeo = new THREE.BufferGeometry();
    const facePositions = new Float32Array(478 * 3);
    faceGeo.setAttribute('position', new THREE.BufferAttribute(facePositions, 3));
    faceGeo.setIndex(FACE_TRIS);

    // Material de debug: verde semi-transparente pra ver o alinhamento
    // Quando estiver alinhado, trocar por: colorWrite:false, depthWrite:true
    const occlusionMat = new THREE.MeshBasicMaterial({
      color: 0x00ff00,
      transparent: true,
      opacity: 0.35,
      side: THREE.FrontSide,
      depthWrite: true,
    });
    const faceMesh3D = new THREE.Mesh(faceGeo, occlusionMat);
    faceMesh3D.renderOrder = 0; // renderiza ANTES dos óculos
    scene.add(faceMesh3D);

    // ── Modelo dos óculos ─────────────────────────────────────────────────────
    let glassesWrapper = null;

    const loader = new THREE.GLTFLoader();
    loader.load(
      'http://localhost:3000/reading_glasses.glb',
      (gltf) => {
        const model = gltf.scene;
        model.rotation.set(0, 0, 0);
        model.position.set(0, 0, 0);
        // Garante que os óculos renderizam DEPOIS da malha de oclusão
        model.traverse(o => { if (o.isMesh) o.renderOrder = 1; });

        const wrapper = new THREE.Group();
        wrapper.add(model);
        scene.add(wrapper);
        glassesWrapper = wrapper;
        status.textContent = '✅ Modelo carregado! Aponte o rosto...';
      },
      (p) => { if (p.total > 0) status.textContent = 'Carregando: ' + Math.round(p.loaded/p.total*100) + '%'; },
      (e) => { status.textContent = 'Erro: ' + e.message; }
    );

    // ── Converte landmark → espaço 3D ─────────────────────────────────────────
    // Converte landmark normalizado (0..1) para espaço 3D da câmera perspectiva.
    // Com FOV=63° e câmera em z=1, o plano visível em z=0 tem largura ~2*tan(31.5°) ≈ 1.22
    // Então multiplicamos por esse fator em vez de 2 para a malha casar com o vídeo.
    const LM_SCALE_XY = 1.22;
    function lmToVec3(lm) {
      return new THREE.Vector3(
        -(lm.x * LM_SCALE_XY - LM_SCALE_XY / 2),
        -(lm.y * LM_SCALE_XY - LM_SCALE_XY / 2),
        -lm.z * 2
      );
    }

    // ── MediaPipe Face Mesh ───────────────────────────────────────────────────
    const faceMesh = new FaceMesh({
      locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + f
    });
    faceMesh.setOptions({
      maxNumFaces: 1, refineLandmarks: true,
      minDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
    });

    faceMesh.onResults(results => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const lms = results.multiFaceLandmarks[0];

        // ── Atualiza malha de oclusão ────────────────────────────────────────
        // Copia as coordenadas dos 478 landmarks para o buffer de vértices
        for (let i = 0; i < Math.min(lms.length, 478); i++) {
          const v = lmToVec3(lms[i]);
          facePositions[i * 3]     = v.x;
          facePositions[i * 3 + 1] = v.y;
          facePositions[i * 3 + 2] = v.z;
        }
        faceGeo.attributes.position.needsUpdate = true;
        faceGeo.computeBoundingSphere();

        // ── Posição dos óculos ───────────────────────────────────────────────
        if (glassesWrapper) {
          const noseBridge = lmToVec3(lms[6]);
          const templeL    = lmToVec3(lms[234]);
          const templeR    = lmToVec3(lms[454]);
          const chin       = lmToVec3(lms[152]);
          const top        = lmToVec3(lms[10]);

          const center = new THREE.Vector3()
            .addVectors(templeL, templeR)
            .multiplyScalar(0.5);
          center.y = noseBridge.y;
          center.z = noseBridge.z;
          glassesWrapper.position.copy(center);

          const faceWidth  = templeL.distanceTo(templeR);
          const faceHeight = top.distanceTo(chin);
          glassesWrapper.scale.setScalar(faceWidth * 0.25);

          const dir    = new THREE.Vector3().subVectors(templeR, templeL).normalize();
          const angleZ = Math.atan2(dir.y, dir.x);
          const angleY = Math.atan2(templeR.z - templeL.z, faceWidth);
          const angleX = Math.atan2(top.z - chin.z, faceHeight);

          glassesWrapper.rotation.set(angleX + Math.PI, -angleY + Math.PI, angleZ);
        }

        status.textContent = '✅ Rosto detectado!';
      } else {
        status.textContent = '👀 Procurando rosto...';
      }

      renderer.render(scene, cam3);
    });

    // ── Câmera do dispositivo ─────────────────────────────────────────────────
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(stream => {
        const video = document.getElementById('video');
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          status.textContent = '📷 Câmera OK, carregando IA...';
          const c = new Camera(video, {
            onFrame: async () => { await faceMesh.send({ image: video }); },
            width: 640, height: 480,
          });
          c.start();
        };
      })
      .catch(e => { status.textContent = 'Erro câmera: ' + e.message; });

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      cam3.aspect = window.innerWidth / window.innerHeight;
      cam3.updateProjectionMatrix();
    });
  </script>
</body>
</html>
