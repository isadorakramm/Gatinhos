<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    video {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh; object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas-three { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
    #status { position: absolute; top: 10px; left: 10px;
              color: lime; font-family: monospace; font-size: 14px; z-index: 99; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas-three"></canvas>
  <div id="status">Iniciando câmera...</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const video  = document.getElementById('video');
    const status = document.getElementById('status');

    // ── Three.js setup ────────────────────────────────────────────────────────
    const threeCanvas = document.getElementById('canvas-three');
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.sortObjects = true;

    const scene = new THREE.Scene();

    // Câmera ortográfica: mapeia pixels diretamente, sem distorção de perspectiva.
    // Isso elimina o problema de calibração do FOV que estava causando o mismatch.
    // range: -1..+1 em Y, -aspect..+aspect em X
    let aspect = window.innerWidth / window.innerHeight;
    const orthoCam = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, -10, 10);
    orthoCam.position.z = 1;

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(0, 1, 2);
    scene.add(dirLight);

    // ── Triangulação canônica do Face Mesh (lista completa) ───────────────────
    // 468 triângulos × 3 índices, extraída do repositório oficial do MediaPipe
        const FACE_TRIS = [
      10,338,297,10,297,332,10,332,284,10,284,251,10,251,389,10,389,356,10,356,454,
      10,454,323,10,323,361,10,361,288,10,288,397,10,397,365,10,365,379,10,379,378,
      10,378,400,10,400,377,10,377,152,10,152,148,10,148,176,10,176,149,10,149,150,
      10,150,136,10,136,172,10,172,58,10,58,132,10,132,93,10,93,234,10,234,127,
      10,127,162,10,162,21,10,21,54,10,54,103,10,103,67,10,67,109,
      33,7,163,33,163,144,33,144,145,33,145,153,33,153,154,33,154,155,33,155,133,
      246,33,133,246,133,7,362,398,384,362,384,385,362,385,386,362,386,387,362,387,388,
      362,388,466,362,466,263,398,362,263,1,44,4,4,44,220,4,220,5,5,220,45,
      1,19,4,234,93,227,127,234,227,162,127,139,361,288,357,454,361,357,323,454,366,
      152,377,400,152,400,378,152,378,379,152,379,365,152,365,397,152,397,288,152,288,361,
      152,361,323,152,323,454,152,454,356,152,356,389,152,389,251,152,251,284,152,284,332,
      152,332,297,152,297,338,356,389,264,356,264,447,447,264,345,345,264,372,372,264,383,
      383,264,300,300,264,276,276,264,383,127,162,21,234,127,93,93,127,132,132,127,58,
      58,127,172,172,127,136,136,127,150,150,127,149,149,127,176,176,127,148,168,6,122,
      168,122,196,168,196,3,168,3,51,168,51,45,168,45,4,197,168,196,195,168,197,
      5,168,195,116,123,111,111,123,117,117,123,118,118,123,50,50,123,101,101,123,36,
      36,123,205,205,123,206,206,123,207,207,123,216,216,123,212,345,352,340,340,352,346,
      346,352,347,347,352,280,280,352,425,425,352,411,411,352,436,436,352,427,427,352,432,
      61,146,91,61,91,181,61,181,84,61,84,17,61,17,314,61,314,405,61,405,321,
      61,321,375,61,375,291,185,40,39,185,39,37,185,37,0,185,0,267,185,267,269,
      185,269,270,185,270,409,185,409,291,78,95,88,78,88,178,78,178,87,78,87,14,
      78,14,317,78,317,402,78,402,318,78,318,324,308,415,324,308,324,318,308,318,402,
      308,402,317,308,317,14,308,14,87,308,87,178,308,178,88,308,88,95,308,95,78,
      107,55,8,8,55,193,8,193,168,55,107,105,105,107,66,66,107,69,69,107,104,
      336,285,8,8,285,417,8,417,168,285,336,334,334,336,296,296,336,299,299,336,333,
      447,264,376,376,264,433,433,264,416,416,264,434,434,264,430,430,264,431,227,93,137,
      137,93,177,177,93,215,215,93,138,138,93,135,135,93,210,
    ];

    // ── Malha de oclusão ──────────────────────────────────────────────────────
    const faceGeo = new THREE.BufferGeometry();
    const facePositions = new Float32Array(478 * 3);
    faceGeo.setAttribute('position', new THREE.BufferAttribute(facePositions, 3));
    faceGeo.setIndex(FACE_TRIS);

    // DEBUG: verde semi-transparente — mudar para occlusionMat quando alinhado
    const debugMat = new THREE.MeshBasicMaterial({
      color: 0x00ff00, transparent: true, opacity: 0.35,
      side: THREE.FrontSide, depthWrite: true,
    });
    const occlusionMat = new THREE.MeshBasicMaterial({
      colorWrite: false, depthWrite: true, side: THREE.FrontSide,
    });
    const faceMesh3D = new THREE.Mesh(faceGeo, occlusionMat); // trocar debugMat → occlusionMat depois
    faceMesh3D.renderOrder = 0;
    scene.add(faceMesh3D);

    // ── Modelo dos óculos ─────────────────────────────────────────────────────
    let glassesWrapper = null;
    const loader = new THREE.GLTFLoader();
    loader.load(
      'http://localhost:3000/reading_glasses.glb',
      (gltf) => {
        const model = gltf.scene;
        model.rotation.set(0, 0, 0);
        model.traverse(o => { if (o.isMesh) o.renderOrder = 1; });
        const wrapper = new THREE.Group();
        wrapper.add(model);
        scene.add(wrapper);
        glassesWrapper = wrapper;
        status.textContent = '✅ Modelo carregado! Aponte o rosto...';
      },
      (p) => { if (p.total > 0) status.textContent = 'Carregando: ' + Math.round(p.loaded/p.total*100) + '%'; },
      (e) => { status.textContent = 'Erro: ' + e.message; }
    );

    // ── Conversão de landmark para espaço 3D ──────────────────────────────────
    // Usa a mesma lógica do código 2D original (drawW/drawH/offsetX/offsetY)
    // para compensar o object-fit:cover, mas converte para NDC ortográfico.
    function lmToWorld(lm, drawW, drawH, offsetX, offsetY, displayW, displayH) {
      // 1. Converte para pixel na tela (igual ao código 2D)
      const px = lm.x * drawW + offsetX;
      const py = lm.y * drawH + offsetY;

      // 2. Normaliza para NDC: 0..displayW → -aspect..+aspect, 0..displayH → 1..-1
      // O vídeo está espelhado com scaleX(-1), então invertemos X
      const nx = -( px / displayW * 2 * aspect - aspect );
      const ny = -( py / displayH * 2 - 1 );
      const nz = -lm.z * 0.15; // Z suave, só pra oclusão funcionar

      return new THREE.Vector3(nx, ny, nz);
    }

    // ── MediaPipe Face Mesh ───────────────────────────────────────────────────
    const faceMesh = new FaceMesh({
      locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + f
    });
    faceMesh.setOptions({
      maxNumFaces: 1, refineLandmarks: true,
      minDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
    });

    faceMesh.onResults(results => {
      const displayW = window.innerWidth;
      const displayH = window.innerHeight;

      // Recalcula drawW/drawH/offset igual ao código 2D original
      const videoAspect   = video.videoWidth  / video.videoHeight;
      const displayAspect = displayW / displayH;
      let drawW, drawH, offsetX, offsetY;
      if (displayAspect > videoAspect) {
        drawW = displayW; drawH = displayW / videoAspect;
        offsetX = 0; offsetY = (displayH - drawH) / 2;
      } else {
        drawH = displayH; drawW = displayH * videoAspect;
        offsetX = (displayW - drawW) / 2; offsetY = 0;
      }

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const lms = results.multiFaceLandmarks[0];

        // Atualiza malha de oclusão
        for (let i = 0; i < Math.min(lms.length, 478); i++) {
          const v = lmToWorld(lms[i], drawW, drawH, offsetX, offsetY, displayW, displayH);
          facePositions[i*3]   = v.x;
          facePositions[i*3+1] = v.y;
          facePositions[i*3+2] = v.z;
        }
        faceGeo.attributes.position.needsUpdate = true;
        faceGeo.computeBoundingSphere();

        // Posiciona e rotaciona os óculos
        if (glassesWrapper) {
          const noseBridge = lmToWorld(lms[6],   drawW, drawH, offsetX, offsetY, displayW, displayH);
          const templeL    = lmToWorld(lms[234], drawW, drawH, offsetX, offsetY, displayW, displayH);
          const templeR    = lmToWorld(lms[454], drawW, drawH, offsetX, offsetY, displayW, displayH);
          const chin       = lmToWorld(lms[152], drawW, drawH, offsetX, offsetY, displayW, displayH);
          const top        = lmToWorld(lms[10],  drawW, drawH, offsetX, offsetY, displayW, displayH);

          // Usa landmark 168 (centro exato entre os olhos) como âncora de posição
          // em X, Y e Z — ele segue o rosto em todas as direções, inclusive
          // quando o rosto está virado e uma têmpora some atrás da cabeça
          const eyeCenter = lmToWorld(lms[168], drawW, drawH, offsetX, offsetY, displayW, displayH);
          glassesWrapper.position.copy(eyeCenter);
          glassesWrapper.position.z += 0.05; // empurra pra frente da malha

          const faceWidth  = templeL.distanceTo(templeR);
          const faceHeight = top.distanceTo(chin);
          // Escala recalibrada para câmera ortográfica
          glassesWrapper.scale.setScalar(faceWidth * 0.4);

          const dir    = new THREE.Vector3().subVectors(templeR, templeL).normalize();
          const angleZ = Math.atan2(dir.y, dir.x);
          // Z do MediaPipe é muito pequeno na projeção ortográfica — amplificamos
          // só para o cálculo dos ângulos, sem afetar a posição
          const zScale = 8.0;
          const angleY = Math.atan2((templeR.z - templeL.z) * zScale, faceWidth);
          const angleX = Math.atan2((top.z - chin.z) * zScale, faceHeight);
          glassesWrapper.rotation.set(angleX + Math.PI, -angleY + Math.PI, angleZ);
        }

        status.textContent = '✅ Rosto detectado!';
      } else {
        status.textContent = '👀 Procurando rosto...';
      }

      renderer.render(scene, orthoCam);
    });

    // ── Câmera do dispositivo ─────────────────────────────────────────────────
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          status.textContent = '📷 Câmera OK, carregando IA...';
          const c = new Camera(video, {
            onFrame: async () => { await faceMesh.send({ image: video }); },
            width: 640, height: 480,
          });
          c.start();
        };
      })
      .catch(e => { status.textContent = 'Erro câmera: ' + e.message; });

    window.addEventListener('resize', () => {
      aspect = window.innerWidth / window.innerHeight;
      renderer.setSize(window.innerWidth, window.innerHeight);
      orthoCam.left = -aspect; orthoCam.right = aspect;
      orthoCam.updateProjectionMatrix();
    });
  </script>
</body>
</html>
