<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; background: #000; overflow: hidden;}
    video { 
        position: absolute; top: 0; left: 0;
        width: 100vw; height: 100vh; object-fit: cover;
        transform: scaleX(-1)
    }
    #canvas-mediapipe {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: none; /* só pra debug, muda pra block se quiser ver o mesh */
    }
    #canvas-three {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
    }
    #status { position: absolute; top: 10px; left: 10px;
      color: lime; font-family: monospace; font-size: 14px; z-index: 99; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas-mediapipe"></canvas>
  <canvas id="canvas-three"></canvas>
  <div id="status">Iniciando câmera...</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>THREE.GLTFLoader = THREE.GLTFLoader || window.GLTFLoader;</script>

  <script>
    const video  = document.getElementById('video');
    const canvas = document.getElementById('canvas-mediapipe');
    const ctx    = canvas.getContext('2d');
    const status = document.getElementById('status');



    // ── Three.js setup ──────────────────────────────────────────────
    const threeCanvas = document.getElementById('canvas-three');
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    status.textContent = 'Three.js OK - iniciando loader...';
    setTimeout(() => {
      if (status.textContent === 'Three.js OK - iniciando loader...') {
        status.textContent = 'TRAVOU antes do loader';
      }
    }, 3000);

    const scene  = new THREE.Scene();
    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, 0.01, 100);
    camera.position.z = 1;

    // Iluminação
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(0, 1, 2);
    scene.add(dirLight);

    // Carrega o modelo de óculos
    let glassesModel = null;
    const loader = new THREE.GLTFLoader();
    loader.load(
      'http://localhost:3000/reading_glasses.glb',
      (gltf) => {
        glassesModel = gltf.scene;
        glassesModel.visible = false;
        scene.add(glassesModel);
        status.textContent = '✅ Modelo carregado! Aponte o rosto...';
      },
      (progress) => {
        status.textContent = 'Carregando modelo: ' + Math.round(progress.loaded / progress.total * 100) + '%';
      },
      (err) => { 
        status.textContent = 'Erro modelo: ' + (err.message || JSON.stringify(err));
      }
    );



    // ── Landmarks que vamos usar ─────────────────────────────────────
    // 168 = ponta do nariz (centro)
    // 234 = têmpora esquerda
    // 454 = têmpora direita
    // 6   = topo do nariz (entre os olhos)

    function landmarkToWorld(lm, displayW, displayH) {
      // Converte coordenada normalizada do MediaPipe para espaço 3D do Three.js
      // x: 0..1 → -1..1 (invertido por causa do espelho)
      // y: 0..1 → 1..-1
      const x = -(lm.x * 2 - 1);
      const y =  -(lm.y * 2 - 1);
      const z = -lm.z * 2;
      return new THREE.Vector3(x, y, z);
    }



    // ── MediaPipe Face Mesh ──────────────────────────────────────────
    const faceMesh = new FaceMesh({ locateFile: f =>
      'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + f });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
    faceMesh.onResults(results => {
      if (!glassesModel) return;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        status.textContent = '✅ Rosto detectado!';
        const lms = results.multiFaceLandmarks[0];

        const noseBridge = landmarkToWorld(lms[6]);       // entre os olhos
        const templeL    = landmarkToWorld(lms[234]);     // têmpora esquerda
        const templeR    = landmarkToWorld(lms[454]);     // têmpora direita

        // Posição: centro entre as duas têmporas, na altura da ponte do nariz
        const center = new THREE.Vector3()
          .addVectors(templeL, templeR)
          .multiplyScalar(0.5);
        center.y = noseBridge.y;
        center.z = noseBridge.z;

        glassesModel.position.copy(center);

        // Escala: distância entre as têmporas
        const faceWidth = templeL.distanceTo(templeR);
        const scale = faceWidth * 0.27;
        glassesModel.scale.setScalar(scale);

        // Rotação: alinha com o vetor entre as têmporas
        // Rotação Z: inclinação lateral
        const dir = new THREE.Vector3().subVectors(templeR, templeL).normalize();
        const angleZ = Math.atan2(dir.y, dir.x);

        // Rotação Y: virar a cabeça pra esquerda/direita
        const nose = landmarkToWorld(lms[1]);
        const angleY = -(templeR.z - templeL.z) * 2;

        // Rotação X: inclinar pra cima/baixo
        const angleX = -(lms[10].z - lms[152].z) * 3;

        glassesModel.rotation.set(Math.PI + angleX, Math.PI + angleY, angleZ);

        glassesModel.visible = true;
      } else {
        status.textContent = '👀 Procurando rosto...';
        glassesModel.visible = false;
      }

      renderer.render(scene, camera);
    });



    // ── Câmera ───────────────────────────────────────────────────────
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          status.textContent = '📷 Câmera OK, carregando IA...';
          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
          const cam = new Camera(video, {
            onFrame: async () => { await faceMesh.send({ image: video }); },
            width: 640, height: 480,
          });
          cam.start();
        };
      })
      .catch(e => { status.textContent = 'Erro câmera: ' + e.message; });

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      const aspect = window.innerWidth / window.innerHeight;
      camera.left = -aspect;
      camera.right = aspect;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
